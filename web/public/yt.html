<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Hub · يوتيوب</title>
<!--
  YouTube's own player (the official embed), full screen, with Watch Hub's picture controls on
  top: every fit and shape, zoom and width by steps (for screens like car head units where pinching
  does not work). Used by the web app and, inside a WebView, by the Android app.
  ?v=VIDEO_ID  — the picture settings and where each video stopped are kept on this device.
-->
<style>
  :root { --gold: #e8a33d; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #frame { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  #frame iframe, #p { width: 100%; height: 100%; border: 0; display: block; }
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 10px 12px;
    background: linear-gradient(rgba(0,0,0,.75), transparent); transition: opacity .25s; z-index: 5; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar.hidden { opacity: 0; }
  .bar.hidden > * { pointer-events: none; }
  .bar .title { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: #fff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  button:focus-visible, button:hover { background: var(--gold); color: #111; outline: none; }
  button.on { color: var(--gold); border-color: var(--gold); }
  .panel { position: fixed; top: 0; bottom: 0; left: 0; width: min(330px, 85vw); background: rgba(20,18,16,.92); z-index: 6;
    padding: 14px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .panel[hidden], .msg[hidden] { display: none; }
  .panel h3 { margin: 4px 0; }
  .panel h4 { margin: 10px 0 2px; color: var(--gold); font-size: 13px; }
  .panel .row { display: flex; gap: 8px; }
  .panel .row button { flex: 1; }
  .panel button.mode { text-align: right; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; z-index: 4; background: #000; }
  .msg div { max-width: 460px; display: grid; gap: 14px; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="p"></div></div></div>
<div class="bar" id="bar">
  <button id="back" title="رجوع">→ رجوع</button>
  <span class="title" id="title"></span>
  <button id="pic" title="حجم الصورة">⛶ حجم الصورة</button>
  <button id="yt" title="افتح في يوتيوب">يوتيوب ↗</button>
</div>
<div class="panel" id="panel" hidden></div>
<div class="msg" id="msg" hidden><div><b id="msgText"></b><button id="msgOpen">افتح في تطبيق يوتيوب</button></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const id = params.get("v") || "";
  const android = window.Android || null; // the Android app's bridge, when inside it
  $("title").textContent = params.get("title") || "";

  // ---------- picture: fit / shapes, zoom and width ----------
  const MODES = [
    ["ملاءمة الشاشة (بدون قص)"], ["ملء الشاشة مع قص الأطراف"], ["تمديد على كامل الشاشة"],
    ["16:9", 16 / 9], ["18:9", 2], ["21:9", 21 / 9], ["2.35:1 (سينما)", 2.35], ["4:3", 4 / 3],
  ];
  let pic = { mode: 0, zoom: 1, stretch: 1 };
  try { pic = { ...pic, ...JSON.parse(localStorage.getItem("yt.picture") || "{}") }; } catch { /* first time */ }
  const savePic = () => { try { localStorage.setItem("yt.picture", JSON.stringify(pic)); } catch { /* private */ } };

  function layout() {
    const vw = innerWidth, vh = innerHeight, V = 16 / 9;
    let w, h, sx = 1, sy = 1;
    const m = Math.min(pic.mode, MODES.length - 1);
    if (m === 0) {
      // YouTube fits the video inside the frame itself.
      w = vw; h = vh;
    } else if (m === 1) {
      // Cover: a 16:9 frame big enough to fill the screen, edges cut.
      if (vw / vh > V) { w = vw; h = vw / V; } else { h = vh; w = vh * V; }
    } else if (m === 2) {
      // Stretch a 16:9 frame to exactly the screen.
      if (vw / vh > V) { h = vh; w = vh * V; sx = vw / w; } else { w = vw; h = vw / V; sy = vh / h; }
    } else {
      // A fixed shape: the 16:9 picture drawn at ratio r, as big as fits.
      const r = MODES[m][1];
      h = Math.min(vh, vw / r); w = h * V; sx = r / V;
    }
    const f = $("frame");
    f.style.width = `${w}px`;
    f.style.height = `${h}px`;
    f.style.transform = `translate(-50%, -50%) scale(${sx * pic.zoom * pic.stretch}, ${sy * pic.zoom})`;
  }
  addEventListener("resize", layout);
  layout();

  function drawPanel() {
    const p = $("panel");
    p.innerHTML = `<h3>حجم الصورة</h3>
      <h4>التكبير: ${Math.round(pic.zoom * 100)}%</h4>
      <div class="row"><button data-z="-1">− تصغير</button><button data-z="1">+ تكبير</button></div>
      <h4>العرض (تمديد أفقي): ${Math.round(pic.stretch * 100)}%</h4>
      <div class="row"><button data-s="-1">− تصغير</button><button data-s="1">+ تكبير</button></div>
      <button data-reset>رجّع كل شي للأصل</button>
      <h4>طريقة العرض</h4>
      ${MODES.map(([label], i) => `<button class="mode ${i === pic.mode ? "on" : ""}" data-m="${i}">${label}${i === pic.mode ? " ✓" : ""}</button>`).join("")}
      <button data-close>إغلاق</button>`;
  }
  function openPanel() {
    drawPanel();
    $("panel").hidden = false;
    $("panel").querySelector("button")?.focus();
  }
  const closePanel = () => { $("panel").hidden = true; $("pic").focus(); wake(); };
  $("panel").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.close !== undefined) return closePanel();
    if (b.dataset.z) pic.zoom = Math.max(0.5, Math.min(4, +(pic.zoom + 0.05 * b.dataset.z).toFixed(2)));
    if (b.dataset.s) pic.stretch = Math.max(0.5, Math.min(2, +(pic.stretch + 0.05 * b.dataset.s).toFixed(2)));
    if (b.dataset.m) pic.mode = Number(b.dataset.m);
    if (b.dataset.reset !== undefined) pic = { mode: 0, zoom: 1, stretch: 1 };
    savePic();
    layout();
    const keep = [...$("panel").querySelectorAll("button")].indexOf(b);
    drawPanel();
    $("panel").querySelectorAll("button")[keep]?.focus();
  });

  // ---------- top bar ----------
  let idle;
  function wake() {
    $("bar").classList.remove("hidden");
    clearTimeout(idle);
    idle = setTimeout(() => { if ($("panel").hidden) $("bar").classList.add("hidden"); }, 3500);
  }
  ["mousemove", "touchstart", "keydown"].forEach((t) => addEventListener(t, wake, { passive: true }));
  wake();
  const close = () => {
    savePos();
    if (android) android.close();
    else if (history.length > 1) history.back();
    else location.href = "/#/youtube";
  };
  const openInYouTube = () => {
    savePos();
    const t = player?.getCurrentTime ? Math.floor(player.getCurrentTime()) : 0;
    if (android) android.openInYouTube(id, t);
    else window.open(`https://www.youtube.com/watch?v=${encodeURIComponent(id)}&t=${t}s`, "_blank");
  };
  $("back").addEventListener("click", close);
  $("pic").addEventListener("click", openPanel);
  $("yt").addEventListener("click", openInYouTube);
  $("msgOpen").addEventListener("click", openInYouTube);

  // ---------- the player ----------
  let player = null;
  const posKey = `yt.pos.${id}`;
  const startAt = Number(params.get("t")) || Number(localStorage.getItem(posKey)) || 0;
  function savePos() {
    try {
      if (!player?.getCurrentTime) return;
      const t = player.getCurrentTime(), d = player.getDuration();
      if (d > 0 && t > 15 && t < d * 0.95) localStorage.setItem(posKey, String(Math.floor(t)));
      else localStorage.removeItem(posKey);
    } catch { /* not ready */ }
  }
  setInterval(savePos, 5000);
  addEventListener("pagehide", savePos);

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("p", {
      videoId: id,
      host: "https://www.youtube.com",
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, fs: 0, start: Math.floor(startAt), origin: location.origin, hl: "ar" },
      events: {
        onReady: (e) => {
          e.target.playVideo();
          const title = e.target.getVideoData?.().title;
          if (title && !$("title").textContent) $("title").textContent = title;
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) {
            localStorage.removeItem(posKey);
            android?.ended?.();
          }
        },
        onError: (e) => {
          const blocked = e.data === 101 || e.data === 150 || e.data === 153;
          $("msgText").textContent = blocked
            ? "صاحب هذا الفيديو مانع تشغيله برا يوتيوب. شغّله في تطبيق يوتيوب."
            : "ما قدرنا نشغّل هذا الفيديو هنا.";
          $("msg").hidden = false;
          $("msgOpen").focus();
        },
      },
    });
  };

  // ---------- remote / keyboard ----------
  addEventListener("keydown", (e) => {
    if (!$("panel").hidden) {
      if (e.key === "Escape" || e.key === "Backspace" || e.key === "GoBack") { e.preventDefault(); closePanel(); }
      return;
    }
    const focusedButton = document.activeElement?.tagName === "BUTTON";
    if (!player?.getPlayerState) return;
    switch (e.key) {
      case " ":
      case "Enter":
        if (focusedButton) return;
        e.preventDefault();
        player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
        break;
      case "ArrowLeft":
      case "ArrowRight":
        if (focusedButton) return;
        e.preventDefault();
        player.seekTo(Math.max(0, player.getCurrentTime() + (e.key === "ArrowRight" ? 10 : -10)), true);
        break;
      case "ArrowUp":
      case "ArrowDown":
        if (!focusedButton) { e.preventDefault(); $("pic").focus(); }
        break;
      case "Escape":
        close();
        break;
    }
  });

  // Called by the Android app for remote keys it receives first.
  window.whKey = (k) => {
    if (k === "back") {
      if (!$("panel").hidden) { closePanel(); return true; }
      return false;
    }
    if (k === "menu") { openPanel(); return true; }
    return false;
  };
})();
</script>
</body>
</html>
