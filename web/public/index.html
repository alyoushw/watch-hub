<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Watch Hub">
  <title>Watch Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Watch Hub</a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="home">الرئيسية</a>
      <a href="#/live" data-tab="live">مباشر</a>
      <a href="#/search" data-tab="search">البحث</a>
      <a href="#/xtream" data-tab="xtream">قنواتي</a>
      <a href="#/list" data-tab="list">قائمتي</a>
      <a href="#/settings" data-tab="settings">الإعدادات</a>
    </nav>
  </header>
  <main id="view"></main>
  <div id="player" class="player" hidden>
    <video id="video" controls playsinline autoplay></video>
    <div class="player-bar">
      <span id="player-title"></span>
      <button id="player-close" class="btn ghost" type="button">✕ إغلاق</button>
    </div>
    <div id="player-error" class="player-error" hidden></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
