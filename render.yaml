# Render Blueprint for the Watch Hub web app (site + Xtream proxy) on the free plan.
# Render: New → Blueprint → pick this repository and branch.
services:
  - type: web
    name: watch-hub
    runtime: docker
    plan: free
    rootDir: web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # A password for the proxy; Render asks for it once. Put the same value in the
      # site's settings under "مفتاح البروكسي" so nobody else can use your proxy.
      - key: PROXY_KEY
        sync: false
      # API-Football key for the matches data (asked from the app through this server, so it never sits in the app).
      # Render asks for it once; leave it empty to switch that source off.
      - key: FOOTBALL_API_KEY
        sync: false
      - key: FOOTBALL_DAILY_LIMIT
        value: "90"
