name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Private preview or main-channel release (main branch only)'
        type: choice
        default: private
        options:
          - private
          - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WATCHHUB_ANIMEIFY_TOKEN: ${{ secrets.WATCHHUB_ANIMEIFY_TOKEN }}
      WATCHHUB_PREVIEW: ${{ (github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.distribution == 'private')) && 'true' || 'false' }}
      APK_NAME: ${{ (github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.distribution == 'private')) && 'WatchHub-Anime-Preview.apk' || 'WatchHub.apk' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results.txt

      - name: Print lint diagnostics
        if: always()
        run: |
          if [ -f app/build/reports/lint-results.txt ]; then
            cat app/build/reports/lint-results.txt
          fi

      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-smoke.sh

      - name: Upload device smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WATCHHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WATCHHUB_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set; using the debug key."
          fi

      - name: Build APK
        env:
          WATCHHUB_ANIMEIFY_TOKEN: ${{ secrets.WATCHHUB_ANIMEIFY_TOKEN }}
          WATCHHUB_KEYSTORE_PASSWORD: ${{ secrets.WATCHHUB_KEYSTORE_PASSWORD }}
          WATCHHUB_KEY_ALIAS: ${{ secrets.WATCHHUB_KEY_ALIAS }}
          WATCHHUB_KEY_PASSWORD: ${{ secrets.WATCHHUB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        if: env.WATCHHUB_PREVIEW != 'true'
        with:
          name: WatchHub-apk
          path: ${{ env.APK_NAME }}

      # Validate source configuration before creating any release asset.
      - name: Verify release source configuration
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          ANIMEIFY_TOKEN: ${{ secrets.WATCHHUB_ANIMEIFY_TOKEN }}
        run: |
          if [ -z "$ANIMEIFY_TOKEN" ]; then
            echo "Configure WATCHHUB_ANIMEIFY_TOKEN before publishing an Animeify-enabled release."
            exit 1
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.distribution == 'stable'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Watch Hub (build ${{ github.run_number }})
          files: ${{ env.APK_NAME }}
          make_latest: true
          target_commitish: ${{ github.sha }}

      # Draft assets are accessible only to repository writers; the main release is untouched.
      - name: Create private preview draft
        if: github.event_name == 'workflow_dispatch' && inputs.distribution == 'private'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anime-preview-${{ github.run_number }}
          name: Watch Hub Anime - private preview ${{ github.run_number }}
          files: ${{ env.APK_NAME }}
          draft: true
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: 'نسخة خاصة مستقلة للتجربة. لا تستبدل التطبيق الرئيسي ولا تُرسل كتحديث عام.'
