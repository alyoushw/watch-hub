name: Sony Home 1448 preview
on:
  push:
    branches: ['codex/sony-home-1448-preview']
    paths:
      - 'sony-tv/**'
      - '.github/workflows/sony-home-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sony-home-1448-preview
  cancel-in-progress: true
jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows setup script without running it
        shell: powershell
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'sony-tv/Set-SonyHome.ps1'), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          Write-Host 'PowerShell syntax is valid. No device connection attempted.'
  build:
    needs: validate-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and extract reproducible launcher source
        run: |
          echo '98e6e1e123fae1c84270502d39448ac9c59e8031b2ee5fe15795af4793b72b89  sony-tv/sony-home-source.zip' | sha256sum -c -
          unzip -q sony-tv/sony-home-source.zip -d sony-tv/build
          chmod +x sony-tv/build/gradlew
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          mkdir -p "$HOME/.android"
          cp app/debug.keystore "$HOME/.android/debug.keystore"
      - name: Test and build Sony Home
        working-directory: sony-tv/build
        run: |
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Prepare downloads
        run: |
          mkdir -p sony-tv/dist
          cp sony-tv/build/app/build/outputs/apk/release/app-release.apk sony-tv/dist/SonyHome.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs sony-tv/dist/SonyHome.apk > sony-tv/dist/signing-certificate.txt
          grep -q '37908b0667092a428dd22a7ac4065e5cccaafd768f50021219fe4247ea69bf09' sony-tv/dist/signing-certificate.txt
          cp sony-tv/sony-home-source.zip sony-tv/dist/SonyHome-source.zip
          cp sony-tv/Set-SonyHome.ps1 sony-tv/dist/
          cp sony-tv/Set-SonyHome.cmd sony-tv/dist/
          cp sony-tv/README-AR.txt sony-tv/dist/
          cd sony-tv/dist
          zip -j SonyHome-Windows-Setup.zip Set-SonyHome.ps1 Set-SonyHome.cmd README-AR.txt
          sha256sum SonyHome.apk SonyHome-source.zip Set-SonyHome.ps1 Set-SonyHome.cmd SonyHome-Windows-Setup.zip README-AR.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SonyHome-1448
          path: sony-tv/dist/*
      - name: Publish independent launcher preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sony-home-1448-v5
          target_commitish: ${{ github.sha }}
          name: Sony Home 3.7 - Watch Next from all publishing apps
          prerelease: true
          make_latest: false
          body: |
            Experimental personal launcher based on CleanYourTV (MIT), for Sony KD-65X8000G / Android 9.
            This is a separate HOME app (com.alyoushw.sonyhome), not a fork of Watch Hub.
            Compact unboxed calendar under the clock: original printed glyphs as transparent white ink, with native labels including Fajr.
            Times and occasions retain the exact original daily Ahsa 1448 calendar rows; no OCR or calculated replacement.
            Widget and cleanup tools moved to the top bar beside Inputs and Mirroring.
            Sony mirroring opens the native ScreenMirroringHomeActivity confirmed by the owner's device log, with exported-activity checks.
            TCL receiver discovery and a saved receiver-app picker support other Android TV / Google TV devices where those capabilities exist.
            No receiver service is installed or enabled automatically. No Sony-only model restriction. Android 8+ is required.
            Watch Next now reads all publishing apps, respects hidden cards and opens each card in its source app.
            Includes a scrollable recent-card row plus a Watch Next menu with empty/error/permission explanations.
            No claim that Netflix or Crunchyroll publishes Watch Next on every device.
            Includes native app widgets and an AirPlay receiver shortcut.
            AirPlay Server must be installed separately from its original F-Droid page.
            The Windows helper sets and verifies default HOME without disabling previous launchers.
            Build/lint/unit tests are automated; performance, remote navigation and firmware persistence still require real-TV testing.
            Watch Hub remains on its normal official release/update track.
          files: sony-tv/dist/*
