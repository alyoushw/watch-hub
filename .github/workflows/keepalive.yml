name: Keep web app awake

# Render's free plan puts the site to sleep after 15 minutes without visitors, and the next
# visit waits about a minute. A request every 10 minutes keeps it awake (one always-on free
# service fits in Render's 750 free hours a month).
# Note: GitHub runs scheduled workflows only from the repository's default branch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://watch-hub-ddfg.onrender.com' }}
        run: curl -fsS -o /dev/null --max-time 120 "$WEB_URL/" || echo "site did not answer (it may still be waking up)"
